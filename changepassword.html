<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Analyst</title>
    <link rel="stylesheet" href="changestyle.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Bank Analyst</h1>
        <img src="Bank.png" alt="Bank Logo">
    </div>
    <div class="form-container">
        <h2>Change Password</h2>
        <form id="changepassword" onsubmit="handleFormSubmit(event)">
            <div class = "form-box">
               
                <label for="newpassword">New Password</label>
                <input type="password" id="npassword" placeholder="Enter new password" required>

                <label for="confirmpassword">Confirm Password</label>
                <input type="password"  id="cpassword" placeholder="Confirm password" required>

            </div>    
            <button type="submit">Submit</button>
        </form>

    </div>
</div>
<script>
    function handleFormSubmit(event) {
    event.preventDefault();

    
    const newPassword = document.getElementById('npassword').value;
    const confirmPassword = document.getElementById('cpassword').value;

    if (newPassword.length < 8) {
        alert('Password must be at least 8 characters long.');
        return; 
    }


    if (newPassword == confirmPassword) {
        alert('Password changed successfully!');
       
        window.location.href = 'login.html';
    } else {
        alert('Passwords do not match. Please try again.');
    }
}
    
</script>

</body>
</html>
