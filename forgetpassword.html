<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Analyst</title>
    <link rel="stylesheet" href="forgetstyle.css">
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Bank Analyst</h1>
        <img src="Bank.png" alt="Bank Logo">
    </div>
    <div class="form-container">
        <h2>Password Recovery</h2>
        <form id="forgetpassword" onsubmit="handleFormSubmit(event)">
            <div class = "form-box">
               
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter your username" required>

                <label for="email">Email</label>
                <input type="email"  id="email" placeholder="Enter your email address" required>

            </div>    
            <button type="submit">Submit</button>
        </form>

    </div>
</div>
<script>
    function handleFormSubmit(event) {
            event.preventDefault(); 

            
            const username = document.getElementById('username').value;
            const email = document.getElementById('email').value;

           
            alert(`Sent successfully. Mail has been sent to the email address ${email}`);
        }
</script>

</body>
</html>
